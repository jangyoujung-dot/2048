<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지구계 2048 - 수정 버전</title>
<style>
body{
  margin:0;
  font-family:'Arial',sans-serif;
  background:linear-gradient(to bottom,#dff6ff,#f7fbff);
  text-align:center;
  overflow:hidden;
}
h1{
  margin-top:18px;
  color:#355070;
}
#topbar{
  display:flex;
  justify-content:center;
  gap:20px;
  margin:10px 0;
}
.info{
  background:white;
  padding:12px 22px;
  border-radius:16px;
  box-shadow:0 4px 10px rgba(0,0,0,0.12);
  font-weight:bold;
  font-size:20px;
}
#board{
  width:460px;
  height:460px;
  background:#bbaea0;
  margin:20px auto;
  padding:10px;
  border-radius:18px;
  box-shadow:0 8px 18px rgba(0,0,0,0.18);
}
#game{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.cell{
  border-radius:14px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-weight:bold;
  color:#333;
  transition:all .15s ease;
  user-select:none;
}
.empty{
  background:#cdc1b4;
}
.spawn{
  animation:spawn .22s ease;
}
.merge{
  animation:merge .22s ease;
}
@keyframes spawn{
  0%{transform:scale(0);}
  100%{transform:scale(1);}
}
@keyframes merge{
  0%{transform:scale(1);}
  50%{transform:scale(1.18);}
  100%{transform:scale(1);}
}
#message{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.45);
  z-index:10;
}
#messageBox{
  background:white;
  padding:35px;
  border-radius:24px;
  width:320px;
  animation:popup .3s ease;
}
@keyframes popup{
  0%{transform:scale(.5);}
  100%{transform:scale(1);}
}
button{
  border:none;
  background:#6c91ff;
  color:white;
  padding:12px 22px;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
}
#combo{
  position:fixed;
  top:120px;
  left:50%;
  transform:translateX(-50%);
  font-size:38px;
  font-weight:bold;
  color:#ff5d8f;
  opacity:0;
  pointer-events:none;
}
.showCombo{
  animation:comboAnim .8s ease;
}
@keyframes comboAnim{
  0%{opacity:0; transform:translateX(-50%) translateY(20px);}
  20%{opacity:1;}
  100%{opacity:0; transform:translateX(-50%) translateY(-40px);}
}
</style>
</head>
<body>
<h1>🌍 지구계 2048</h1>
<div id="topbar">
  <div class="info">점수: <span id="score">0</span></div>
  <div class="info">최고 단계: <span id="best">광물</span></div>
</div>
<p>⬅️➡️⬆️⬇️ 방향키로 움직이세요</p>
<div id="combo"></div>
<div id="board">
  <div id="game"></div>
</div>
<div id="message">
  <div id="messageBox">
    <h2 id="messageTitle"></h2>
    <p id="messageText"></p>
    <button onclick="restart()">다시 하기</button>
  </div>
</div>
<script>
const levels = [
 {name:"광물",emoji:"💎",color:"#d6ecff"},
 {name:"암석",emoji:"🪨",color:"#e0e0e0"},
 {name:"지각",emoji:"🌄",color:"#ffe0b2"},
 {name:"맨틀",emoji:"🔥",color:"#ffccbc"},
 {name:"외핵",emoji:"🌋",color:"#ffab91"},
 {name:"내핵",emoji:"☀️",color:"#ff8a65"},
 {name:"지권",emoji:"🌍",color:"#c8e6c9"},
 {name:"수권",emoji:"💧",color:"#b3e5fc"},
 {name:"기권",emoji:"☁️",color:"#e1f5fe"},
 {name:"생물권",emoji:"🌱",color:"#dcedc8"},
 {name:"외권",emoji:"🛰️",color:"#d1c4e9"},
 {name:"지구계",emoji:"🌎",color:"#a5d6a7"}
];
let grid;
let score;
let comboCount;
function restart(){
  grid = Array(4).fill().map(()=>Array(4).fill(null));
  score = 0;
  comboCount = 0;
  document.getElementById("message").style.display="none";
  randomCell();
  randomCell();
  update();
}
function randomCell(){
  let empty=[];
  for(let i=0;i<4;i++){
    for(let j=0;j<4;j++){
      if(!grid[i][j]) empty.push({i,j});
    }
  }
  if(empty.length===0) return;
  let pick = empty[Math.floor(Math.random()*empty.length)];
  grid[pick.i][pick.j] = {
    value:"광물",
    anim:"spawn"
  };
}
function update(){
  const game=document.getElementById("game");
  game.innerHTML="";
  let best="광물";
  grid.flat().forEach(cell=>{
    const div=document.createElement("div");
    div.className="cell";
    if(!cell){
      div.classList.add("empty");
    }else{
      let obj=levels.find(x=>x.name===cell.value);
      div.style.background=obj.color;
      div.innerHTML=`
        <div style="font-size:28px">${obj.emoji}</div>
        <div>${obj.name}</div>
      `;
      if(cell.anim){
        div.classList.add(cell.anim);
      }
      best=obj.name;
    }
    game.appendChild(div);
  });
  document.getElementById("score").textContent=score;
  document.getElementById("best").textContent=best;
  if(best==="지구계"){
    showMessage(
      "🎉 지구계 완성!",
      "축하합니다! 최종 단계에 도달했어요!"
    );
  }
  clearAnim();
}
function clearAnim(){
  for(let i=0;i<4;i++){
    for(let j=0;j<4;j++){
      if(grid[i][j]){
        grid[i][j].anim="";
      }
    }
  }
}
function showCombo(){
  if(comboCount<2) return;
  const combo=document.getElementById("combo");
  combo.textContent=`🔥 ${comboCount} COMBO!`;
  combo.classList.remove("showCombo");
  void combo.offsetWidth;
  combo.classList.add("showCombo");
}
function showMessage(title,text){
  document.getElementById("messageTitle").textContent=title;
  document.getElementById("messageText").textContent=text;
  document.getElementById("message").style.display="flex";
}
function slide(row){
  let arr=row.filter(v=>v);
  for(let i=0;i<arr.length-1;i++){
    let idx=levels.findIndex(
      l=>l.name===arr[i].value
    );
    if(
      arr[i].value===arr[i+1].value &&
      idx<levels.length-1
    ){
      arr[i]={
        value:levels[idx+1].name,
        anim:"merge"
      };
      arr.splice(i+1,1);
      comboCount++;
      score += (idx+1)*20*comboCount;
    }
  }
  while(arr.length<4){
    arr.push(null);
  }
  return arr;
}
function rotate(){
  let newGrid=
    Array(4).fill().map(
      ()=>Array(4).fill(null)
    );
  for(let i=0;i<4;i++){
    for(let j=0;j<4;j++){
      newGrid[j][3-i]=grid[i][j];
    }
  }
  grid=newGrid;
}
function moveLeft() {
  comboCount = 0;
  let before = JSON.stringify(grid);
  grid = grid.map(r => slide(r));
  if (before !== JSON.stringify(grid)) {
    randomCell();
    showCombo();
    update();
    checkGameOver();
  }
}
function moveRight() {
  comboCount = 0;
  let before = JSON.stringify(grid);
  grid = grid.map(r => slide([...r].reverse()).reverse());
  if (before !== JSON.stringify(grid)) {
    randomCell();
    showCombo();
    update();
    checkGameOver();
  }
}
function moveUp() {
  comboCount = 0;
  let before = JSON.stringify(grid);
  rotate(); rotate(); rotate();
  grid = grid.map(r => slide(r));
  rotate();
  if (before !== JSON.stringify(grid)) {
    randomCell();
    showCombo();
    update();
    checkGameOver();
  }
}
function moveDown() {
  comboCount = 0;
  let before = JSON.stringify(grid);
  rotate();
  grid = grid.map(r => slide(r));
  rotate(); rotate(); rotate();
  if (before !== JSON.stringify(grid)) {
    randomCell();
    showCombo();
    update();
    checkGameOver();
  }
}
function checkGameOver(){
  if(grid.flat().includes(null)) return;
  for(let i=0;i<4;i++){
    for(let j=0;j<3;j++){
      if(grid[i][j].value===grid[i][j+1].value){
        return;
      }
      if(grid[j][i].value===grid[j+1][i].value){
        return;
      }
    }
  }
  showMessage(
    "💥 게임 오버",
    "더 이상 움직일 수 없어요!"
  );
}
document.addEventListener("keydown",e=>{
  if(
    document.getElementById("message").style.display==="flex"
  ) return;
  if(e.key==="ArrowLeft") moveLeft();
  if(e.key==="ArrowRight") moveRight();
  if(e.key==="ArrowUp") moveUp();
  if(e.key==="ArrowDown") moveDown();
});
restart();
</script>
</body>
</html>
